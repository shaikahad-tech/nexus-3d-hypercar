<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="NEXUS 3D — Aether GT Hypercar. A production-grade futuristic sports car showcase built with Three.js, featuring procedural 3D modeling, cinematic lighting, post-processing, physics simulation, and interactive HUD.">
  <meta name="theme-color" content="#08090c">
  <title>NEXUS 3D — Aether GT Hypercar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700;12..96,900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">

  <!-- Three.js importmap — REQUIRED for ES module imports -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- Inline error handler — runs BEFORE main.js, catches everything -->
  <script>
    window.__showFatalError = function(message, error) {
      var loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';
      var overlay = document.getElementById('fatal-error') || document.createElement('div');
      overlay.id = 'fatal-error';
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0a0c10;color:#e8eaed;font-family:monospace;font-size:13px;padding:40px;overflow:auto;line-height:1.6;';
      var stack = (error && error.stack) ? error.stack : (error && error.message) ? error.message : String(error || '');
      overlay.innerHTML = '<h2 style="color:#ff3d2e;font-size:22px;margin-bottom:16px">NEXUS 3D — Error</h2>' +
        '<p style="color:#8b919e;margin-bottom:20px">' + message + '</p>' +
        '<pre style="background:#141821;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:16px;overflow-x:auto;color:#ff6b6b;font-size:12px;white-space:pre-wrap">' +
        stack.replace(/</g, '<').replace(/>/g, '>') + '</pre>';
      if (!overlay.parentNode) document.body.appendChild(overlay);
    };

    // Catch uncaught errors
    window.addEventListener('error', function(e) {
      window.__showFatalError('Uncaught error:', e.error || { message: e.message, stack: '' });
    });
    window.addEventListener('unhandledrejection', function(e) {
      window.__showFatalError('Unhandled promise rejection:', e.reason);
    });

    // 15-second timeout — if loader is still visible, show a message
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var loader = document.getElementById('loader');
        if (loader && loader.style.display !== 'none' && !loader.classList.contains('hide')) {
          window.__showFatalError('The application is taking too long to load. This usually means a JavaScript error occurred during initialization. Open the browser console (F12) to see the error.', { message: 'Timeout: loader still visible after 15 seconds', stack: 'Check browser console (F12) for the actual error message.' });
        }
      }, 15000);
    });
  </script>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">Initializing Aether GT</div>
    <div class="loader-progress" id="loaderProgress">Loading assets...</div>
    <div class="loader-bar-wrap">
      <div class="loader-bar" id="loaderBar"></div>
    </div>
  </div>

  <!-- WebGL not supported fallback -->
  <div id="webgl-error" style="display:none;">
    <div class="error-content">
      <h1>WebGL Not Supported</h1>
      <p>Your browser or device doesn't support WebGL, which is required to render the NEXUS 3D experience.</p>
      <p>Try opening this page in a modern browser like Chrome, Firefox, or Edge on a device with GPU support.</p>
    </div>
  </div>

  <!-- 3D canvas mount point -->
  <div id="canvas-wrap"></div>

  <!-- HUD overlay mount point (populated by UI modules) -->
  <div id="hud"></div>

  <!-- Screenshot flash effect -->
  <div id="screenshot-flash"></div>

  <!-- ES Module entry point — cache-bust query to force browser to load latest version -->
  <script type="module" src="src/main.js?v=2"></script>

</body>
</html>
